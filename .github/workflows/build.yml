name: Build DankCalendar (Arch Linux / Zen 3)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *" # Daily at 00:17 UTC / 05:47 IST

permissions:
  contents: write

concurrency:
  group: dankcalendar-zen3-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update Arch build environment
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel git go make binutils zstd libarchive \
            quickshell qt6-declarative desktop-file-utils

      - name: Create unprivileged package builder
        run: |
          set -euo pipefail
          useradd --create-home builder
          install -d -o builder -g builder /build/dankcalendar
          install -d -o builder -g builder /release

      - name: Create PKGBUILD
        run: |
          set -euo pipefail
          cat > /build/dankcalendar/PKGBUILD <<'PKGBUILD'
          pkgname=dankcalendar-git
          pkgver=0
          pkgrel=1
          pkgdesc='Local, Google, Microsoft, CalDAV, and iCloud calendars for the Dank desktop'
          arch=('x86_64')
          url='https://github.com/AvengeMedia/dankcalendar'
          license=('MIT')
          depends=('quickshell' 'qt6-declarative')
          optdepends=('dms-shell: dynamic theming via DankMaterialShell colors')
          makedepends=('git' 'go' 'make')
          provides=('dcal' 'dankcalendar')
          conflicts=('dcal' 'dankcalendar' 'dankcalendar-bin')
          source=('dankcalendar::git+https://github.com/AvengeMedia/dankcalendar.git#branch=master')
          sha256sums=('SKIP')

          pkgver() {
            cd "$srcdir/dankcalendar"
            printf 'r%s.%s' \
              "$(git rev-list --count HEAD)" \
              "$(git rev-parse --short=7 HEAD)"
          }

          prepare() {
            cd "$srcdir/dankcalendar"
            git submodule sync --recursive
            git submodule update --init --recursive
          }

          build() {
            cd "$srcdir/dankcalendar"
            export GOAMD64=v3
            export CGO_ENABLED=0
            export GOFLAGS='-trimpath'
            export GOTOOLCHAIN=local
            export MAKEFLAGS="-j$(nproc)"

            # One upstream build generates the embedded UI, stripped binary,
            # and shell completions. The upstream Makefile already uses -s -w
            # and embeds version/build/commit metadata in the executable.
            make -C core all
          }

          check() {
            cd "$srcdir/dankcalendar"
            export GOAMD64=v3
            export CGO_ENABLED=0
            export GOFLAGS='-trimpath'
            export GOTOOLCHAIN=local
            make test
          }

          package() {
            cd "$srcdir/dankcalendar"

            install -Dm755 core/bin/dcal \
              "$pkgdir/usr/bin/dcal"

            # Let upstream install script stage desktop entry, icon and metainfo.
            PREFIX=/usr DESTDIR="$pkgdir" \
              sh scripts/install-assets.sh all

            install -Dm644 assets/systemd/dcal.service \
              "$pkgdir/usr/lib/systemd/user/dcal.service"

            install -Dm644 core/bin/completions/dcal \
              "$pkgdir/usr/share/bash-completion/completions/dcal"
            install -Dm644 core/bin/completions/_dcal \
              "$pkgdir/usr/share/zsh/site-functions/_dcal"
            install -Dm644 core/bin/completions/dcal.fish \
              "$pkgdir/usr/share/fish/vendor_completions.d/dcal.fish"

            install -Dm644 LICENSE \
              "$pkgdir/usr/share/licenses/$pkgname/LICENSE"
            install -Dm644 README.md \
              "$pkgdir/usr/share/doc/$pkgname/README.md"
          }
          PKGBUILD

          chown -R builder:builder /build/dankcalendar

      - name: Build and test Arch package
        run: |
          set -euo pipefail
          su builder -s /bin/bash -c '
            set -euo pipefail
            cd /build/dankcalendar
            export GOAMD64=v3
            export CGO_ENABLED=0
            export GOFLAGS="-trimpath"
            export GOTOOLCHAIN=local
            makepkg --syncdeps --cleanbuild --clean --noconfirm
          '

      - name: Verify package and prepare release assets
        run: |
          set -euo pipefail
          cd /build/dankcalendar

          PKG="$(find . -maxdepth 1 -type f -name 'dankcalendar-git-*.pkg.tar.zst' -print -quit)"
          test -n "$PKG"

          pacman -Qip "$PKG"
          echo "==> Compressed Arch package size:"
          ls -lh "$PKG"
          echo "==> Installed dcal binary size:"
          bsdtar -xOf "$PKG" usr/bin/dcal | wc -c
          echo "==> Go build metadata:"
          bsdtar -xOf "$PKG" usr/bin/dcal > /tmp/dcal-verify
          go version -m /tmp/dcal-verify
          CONTENTS="$(bsdtar -tf "$PKG")"
          grep -qx 'usr/bin/dcal' <<< "$CONTENTS"
          grep -qx 'usr/share/applications/com.danklinux.dankcalendar.desktop' <<< "$CONTENTS"
          grep -qx 'usr/share/icons/hicolor/scalable/apps/com.danklinux.dankcalendar.svg' <<< "$CONTENTS"
          grep -qx 'usr/lib/systemd/user/dcal.service' <<< "$CONTENTS"
          grep -qx 'usr/share/bash-completion/completions/dcal' <<< "$CONTENTS"
          grep -qx 'usr/share/zsh/site-functions/_dcal' <<< "$CONTENTS"
          grep -qx 'usr/share/fish/vendor_completions.d/dcal.fish' <<< "$CONTENTS"

          # Stable names let each daily run replace the assets in the rolling release.
          cp "$PKG" /release/dankcalendar-git-latest-x86_64.pkg.tar.zst
          cd /release
          sha256sum dankcalendar-git-latest-x86_64.pkg.tar.zst > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish or update rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DankCalendar latest (Arch Linux · Zen 3)
          body: |
            Automated daily Arch Linux package built from the latest upstream DankCalendar `master` commit, including recursive submodules.

            ### Build
            - Package: `dankcalendar-git`
            - Architecture: `x86_64` / AMD Zen 3
            - Go target: `GOAMD64=v3`
            - CGO: disabled, matching upstream
            - Go build paths: trimmed
            - Package format: Arch Linux `.pkg.tar.zst`

            ### Runtime dependencies
            - `quickshell`
            - `qt6-declarative`

            ### Install or update
            ```bash
            sha256sum -c SHA256SUMS
            sudo pacman -U dankcalendar-git-latest-x86_64.pkg.tar.zst
            ```

            This build targets x86-64-v3 CPUs such as the Ryzen 5 5600GT. It is not intended for older CPUs lacking x86-64-v3 support.
          files: |
            /release/dankcalendar-git-latest-x86_64.pkg.tar.zst
            /release/SHA256SUMS
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}