name: Build DankCalendar AUR-style binary package

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *" # Daily at 00:17 UTC / 05:47 IST

permissions:
  contents: write

concurrency:
  group: dankcalendar-bin-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update Arch build environment
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel curl jq git gzip zstd libarchive \
            quickshell qt6-declarative

      - name: Find latest upstream release
        id: upstream
        run: |
          set -euo pipefail
          TAG="$(curl -fsSL https://api.github.com/repos/AvengeMedia/dankcalendar/releases/latest | jq -r '.tag_name')"
          test -n "$TAG" && test "$TAG" != "null"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $TAG"

      - name: Create AUR-style PKGBUILD
        env:
          PKGVER: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /build/dankcalendar-bin
          cd /build/dankcalendar-bin

          cat > PKGBUILD <<'PKGBUILD'
          _pkgauthor=AvengeMedia
          _repo=dankcalendar
          _binname=dcal
          _iconname=com.danklinux.dankcalendar
          _desktopid=com.danklinux.dankcalendar

          pkgname=dankcalendar-bin
          pkgver=__VERSION__
          pkgrel=1
          pkgdesc='Local, Google, Microsoft, and CalDAV calendars for the dank desktop (prebuilt binary)'
          arch=('x86_64')
          _barch='amd64'
          url="https://github.com/${_pkgauthor}/${_repo}"
          _urlraw="https://raw.githubusercontent.com/${_pkgauthor}/${_repo}/v${pkgver}"
          _urlrel="${url}/releases/download/v${pkgver}"
          license=('MIT')
          depends=('quickshell' 'qt6-declarative')
          optdepends=('dms-shell: dynamic theming via DankMaterialShell colors')
          provides=("${_binname}" "${_repo}")
          conflicts=("${_binname}" "${_repo}" 'dankcalendar-git')

          source=(
            "LICENSE-${pkgver}::${_urlraw}/LICENSE"
            "README-${pkgver}.md::${_urlraw}/README.md"
            "${_desktopid}-${pkgver}.desktop::${_urlraw}/assets/${_desktopid}.desktop"
            "${_binname}-${pkgver}.service::${_urlraw}/assets/systemd/${_binname}.service"
            "${_iconname}-${pkgver}.svg::${_urlrel}/${_iconname}.svg"
            "${_binname}-completions-${pkgver}.tar.gz::${_urlrel}/${_binname}-completions-${pkgver}.tar.gz"
            "${_binname}-x86_64-${pkgver}.gz::${_urlrel}/${_binname}-linux-${_barch}.gz"
          )
          sha256sums=('SKIP' 'SKIP' 'SKIP' 'SKIP' 'SKIP' 'SKIP' 'SKIP')
          noextract=("${_binname}-x86_64-${pkgver}.gz")

          prepare() {
            cd "$srcdir"
            gzip -dcf "${_binname}-x86_64-${pkgver}.gz" > "${_binname}-x86_64-${pkgver}"
            mkdir -p completions
            tar -xzf "${_binname}-completions-${pkgver}.tar.gz" -C completions
          }

          package() {
            cd "$srcdir"

            install -Dm755 "${_binname}-x86_64-${pkgver}" "$pkgdir/usr/bin/${_binname}"

            # Upstream completion archive contains dcal, _dcal and dcal.fish.
            install -Dm644 completions/dcal "$pkgdir/usr/share/bash-completion/completions/${_binname}"
            install -Dm644 completions/_dcal "$pkgdir/usr/share/zsh/site-functions/_${_binname}"
            install -Dm644 completions/dcal.fish "$pkgdir/usr/share/fish/vendor_completions.d/${_binname}.fish"

            install -Dm644 "${_iconname}-${pkgver}.svg" \
              "$pkgdir/usr/share/icons/hicolor/scalable/apps/${_iconname}.svg"
            install -Dm644 "${_desktopid}-${pkgver}.desktop" \
              "$pkgdir/usr/share/applications/${_desktopid}.desktop"
            install -Dm644 "${_binname}-${pkgver}.service" \
              "$pkgdir/usr/lib/systemd/user/${_binname}.service"
            install -Dm644 "LICENSE-${pkgver}" \
              "$pkgdir/usr/share/licenses/${pkgname}/LICENSE"
            install -Dm644 "README-${pkgver}.md" \
              "$pkgdir/usr/share/doc/${pkgname}/README.md"
          }
          PKGBUILD

          # Expand the release version into PKGBUILD while keeping shell variables intact.
          sed -i "s/__VERSION__/${PKGVER}/g" PKGBUILD

      - name: Build Arch package
        run: |
          set -euo pipefail
          useradd --create-home builder
          chown -R builder:builder /build/dankcalendar-bin
          su builder -s /bin/bash -c '
            set -euo pipefail
            cd /build/dankcalendar-bin
            makepkg --syncdeps --cleanbuild --clean --noconfirm
          '

      - name: Verify package and prepare release assets
        run: |
          set -euo pipefail
          cd /build/dankcalendar-bin
          PKG="$(find . -maxdepth 1 -type f -name 'dankcalendar-bin-*.pkg.tar.zst' -print -quit)"
          test -n "$PKG"
          pacman -Qip "$PKG"
          CONTENTS="$(bsdtar -tf "$PKG")"
          grep -qx 'usr/bin/dcal' <<< "$CONTENTS"
          grep -qx 'usr/share/applications/com.danklinux.dankcalendar.desktop' <<< "$CONTENTS"
          grep -qx 'usr/lib/systemd/user/dcal.service' <<< "$CONTENTS"

          mkdir -p /release
          cp "$PKG" /release/dankcalendar-bin-latest-x86_64.pkg.tar.zst
          cd /release
          sha256sum dankcalendar-bin-latest-x86_64.pkg.tar.zst > SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -lh *

      - name: Publish or update rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DankCalendar binary package (Arch Linux)
          body: |
            Automated Arch Linux binary package based on the upstream `dankcalendar-bin` AUR recipe.

            - Package: `dankcalendar-bin`
            - Architecture: `x86_64`
            - Source: official upstream prebuilt release binary (not compiled from source)
            - Runtime dependencies: `quickshell`, `qt6-declarative`
            - Format: Arch Linux `.pkg.tar.zst`

            Install or update:
            ```bash
            sha256sum -c SHA256SUMS
            sudo pacman -U dankcalendar-bin-latest-x86_64.pkg.tar.zst
            ```
          files: |
            /release/dankcalendar-bin-latest-x86_64.pkg.tar.zst
            /release/SHA256SUMS
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}