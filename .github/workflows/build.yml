name: Build Dux Calendar Zen 3 Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: dux-calendar-zen3-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git go sudo github-cli jq coreutils

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package from inline PKGBUILD
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail

          # This repository intentionally contains only build.yml, so define
          # the PKGBUILD here and build the upstream Dux Calendar monorepo.
          BUILD_DIR="/home/builder/pkgbuild"
          useradd --create-home --shell /bin/bash builder || true
          install -d -o builder -g builder "$BUILD_DIR"

          cat > "$BUILD_DIR/PKGBUILD" <<'PKGBUILD'
          pkgname=dux-calendar-git
          _pkgbase=dux-calendar
          pkgver=r1.0000000
          pkgrel=1
          pkgdesc="Standalone calendar app with local, Google, Microsoft, CalDAV and iCloud calendar support"
          arch=('x86_64')
          url="https://github.com/duxlabs-dev/dux-calendar"
          license=('GPL-3.0-or-later')
          depends=('glibc' 'gcc-libs' 'quickshell' 'qt6-declarative' 'qt6-svg' 'qt6-wayland')
          makedepends=('git' 'go>=1.25')
          provides=('dux-calendar' 'dankcalendar')
          conflicts=('dankcalendar')
          source=("dux-calendar::git+https://github.com/duxlabs-dev/dux-calendar.git#branch=master")
          sha256sums=('SKIP')
          options=('!debug' '!strip')

          pkgver() {
            cd "$srcdir/dux-calendar"
            printf 'r%s.%s' "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)"
          }

          prepare() {
            cd "$srcdir/dux-calendar"
            git submodule update --init --recursive
          }

          build() {
            cd "$srcdir/dux-calendar"
            export GOAMD64=v3
            export CGO_ENABLED=0
            make
          }

          package() {
            cd "$srcdir/dux-calendar"
            install -Dm755 core/bin/dcal "$pkgdir/usr/bin/dcal"

            # The upstream Makefile installs desktop integration and the icon.
            # Mirror those paths from the repository assets directory.
            if [[ -f assets/dev.duxlabs.calendar.desktop ]]; then
              install -Dm644 assets/dev.duxlabs.calendar.desktop "$pkgdir/usr/share/applications/dev.duxlabs.calendar.desktop"
            elif [[ -f assets/dev.duxlabs.calendar.desktop.in ]]; then
              install -Dm644 assets/dev.duxlabs.calendar.desktop.in "$pkgdir/usr/share/applications/dev.duxlabs.calendar.desktop"
            fi

            if [[ -f assets/dev.duxlabs.calendar.svg ]]; then
              install -Dm644 assets/dev.duxlabs.calendar.svg "$pkgdir/usr/share/icons/hicolor/scalable/apps/dev.duxlabs.calendar.svg"
            elif [[ -f assets/dev.duxlabs.calendar.png ]]; then
              install -Dm644 assets/dev.duxlabs.calendar.png "$pkgdir/usr/share/icons/hicolor/256x256/apps/dev.duxlabs.calendar.png"
            fi

            if [[ -f assets/dcal.service ]]; then
              install -Dm644 assets/dcal.service "$pkgdir/usr/lib/systemd/user/dcal.service"
            fi

            # Ensure at least the executable is present in the final package.
            test -x "$pkgdir/usr/bin/dcal"
          }
          PKGBUILD

          chown builder:builder "$BUILD_DIR/PKGBUILD"
          cat > /etc/sudoers.d/builder <<'SUDOERS'
          builder ALL=(ALL:ALL) NOPASSWD: ALL
          SUDOERS
          chmod 0440 /etc/sudoers.d/builder
          visudo -cf /etc/sudoers.d/builder

          # Runtime libraries and Go are installed as root; makepkg itself runs
          # as the unprivileged builder account.
          pacman -S --needed --noconfirm git go quickshell qt6-declarative qt6-svg qt6-wayland

          sudo -u builder -H bash -Eeuo pipefail -c '
            cd /home/builder/pkgbuild
            makepkg --syncdeps --noconfirm --cleanbuild --clean
          '

          PKG_PATH="$(find "$BUILD_DIR" -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          test -n "$PKG_PATH"
          PKG_VERSION="$(pacman -Qp "$PKG_PATH" | awk -F ': ' '/^Version[[:space:]]*:/ { print $2; exit }')"
          echo "pkg_path=$PKG_PATH" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Built package version: $PKG_VERSION"

      - name: Stage release assets
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          cp "${{ steps.build.outputs.pkg_path }}" release-assets/dux-calendar-git-latest-x86_64_v3.pkg.tar.zst
          cd release-assets
          sha256sum dux-calendar-git-latest-x86_64_v3.pkg.tar.zst > SHA256SUMS
          printf '%s\n' '${{ steps.build.outputs.pkg_version }}' > PACKAGE_VERSION

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.build.outputs.pkg_version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Dux Calendar latest Git (x86-64-v3)" \
              --notes "Rolling Arch Linux package built from dux-calendar master. Package: dux-calendar-git. CPU target: x86-64-v3."
          fi

          for asset in \
            dux-calendar-git-latest-x86_64_v3.pkg.tar.zst \
            SHA256SUMS \
            PACKAGE_VERSION; do
            gh release delete-asset latest "$asset" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          done

          gh release upload latest \
            release-assets/dux-calendar-git-latest-x86_64_v3.pkg.tar.zst \
            release-assets/SHA256SUMS \
            release-assets/PACKAGE_VERSION \
            --repo "$GITHUB_REPOSITORY"

          gh release edit latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dux Calendar latest Git (x86-64-v3)" \
            --notes "Rolling Arch Linux package built from dux-calendar master. Package version: ${PACKAGE_VERSION}. CPU target: x86-64-v3."