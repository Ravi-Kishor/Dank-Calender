name: Build DankCalendar Zen 3 Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dankcalendar-git-zen3.yml"
      - "PKGBUILD"
      - ".*"

permissions:
  contents: write

concurrency:
  group: dankcalendar-zen3-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git go base-devel jq coreutils findutils

      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail

          # The package build runs in an Arch container; keep package metadata
          # separate from the moving release asset filename.
          makepkg --syncdeps --noconfirm --cleanbuild --clean
          PKG_PATH="$(find . -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          test -n "$PKG_PATH"
          PKG_VERSION="$(pacman -Qp --print-format '%v' "$PKG_PATH")"
          echo "pkg_path=$PKG_PATH" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Built package version: $PKG_VERSION"

      - name: Stage stable asset names and checksums
        id: assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          cp "${{ steps.build.outputs.pkg_path }}" "release-assets/dankcalendar-git-latest-x86_64_v3.pkg.tar.zst"
          cd release-assets
          sha256sum dankcalendar-git-latest-x86_64_v3.pkg.tar.zst > SHA256SUMS
          printf '%s\n' '${{ steps.build.outputs.pkg_version }}' > PACKAGE_VERSION
          echo "asset_dir=release-assets" >> "$GITHUB_OUTPUT"

      - name: Publish rolling GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.build.outputs.pkg_version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pacman -S --needed --noconfirm github-cli
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "DankCalendar latest Git (Arch Linux · Zen 3)" \
              --notes "Automated Arch Linux package from duxlabs-dev/dux-calendar master. Package: dankcalendar-git. Architecture: x86_64. CPU target: AMD Zen 3 / x86-64-v3 (GOAMD64=v3). The _x86_64_v3 asset requires an x86-64-v3-capable CPU."

          # Remove previous rolling assets so the release only exposes the
          # current package, checksum, and package-version metadata.
          gh release delete-asset latest dankcalendar-git-latest-x86_64_v3.pkg.tar.zst \
            --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release delete-asset latest SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release delete-asset latest PACKAGE_VERSION \
            --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true

          gh release upload latest \
            release-assets/dankcalendar-git-latest-x86_64_v3.pkg.tar.zst \
            release-assets/SHA256SUMS \
            release-assets/PACKAGE_VERSION \
            --repo "$GITHUB_REPOSITORY"

          # Update the release notes with the package version so the updater
          # can check it without downloading the large package.
          gh release edit latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "DankCalendar latest Git (Arch Linux · Zen 3)" \
            --notes "Automated Arch Linux package from duxlabs-dev/dux-calendar master. Package: dankcalendar-git. Package version: ${PACKAGE_VERSION}. Architecture: x86_64. CPU target: AMD Zen 3 / x86-64-v3 (GOAMD64=v3). The _x86_64_v3 asset requires an x86-64-v3-capable CPU."